<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LAHZA | Make every second count</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#050505;--panel:#101010;--line:#2a2a2a;--text:#fff;--mute:#9a9a9a;--gold:#c8964f;--pad:clamp(20px,5vw,64px)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Archivo",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
svg{display:block;width:100%;height:auto}

/* header */
.hdr{position:absolute;inset:0 0 auto;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:20px var(--pad)}
.hdr.solid{position:sticky;top:0;background:rgba(5,5,5,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .l,.hdr .r{display:flex;gap:18px;align-items:center}.hdr .r{justify-content:flex-end}
.hdr svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.6}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:.32em;margin-right:-.32em}
.bag{position:relative}.bag b{position:absolute;top:-7px;right:-9px;min-width:17px;height:17px;border-radius:9px;background:var(--gold);color:#000;font-size:.65rem;display:grid;place-items:center}
.menu{position:fixed;inset:0;z-index:30;background:#050505;padding:28px var(--pad);display:none;flex-direction:column;gap:6px}
.menu.open{display:flex}
.menu a{font-size:clamp(2rem,8vw,3.4rem);font-weight:800;letter-spacing:.02em;padding:8px 0;border-bottom:1px solid var(--line)}
.menu button{align-self:flex-end;font-size:2rem;margin-bottom:24px}

/* hero */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 var(--pad) 48px;background:radial-gradient(120% 70% at 70% 35%,#2a1d10 0%,#0a0806 55%,#000 100%) center/cover}
.hero-img{position:absolute;inset:0;background:var(--hero) center/cover no-repeat;opacity:0;transition:opacity .8s}
.hero.has-img .hero-img{opacity:1}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#000 4%,rgba(0,0,0,.15) 55%,rgba(0,0,0,.45))}
.hero-watch{position:absolute;left:50%;top:44%;width:min(62vw,340px);transform:translate(-50%,-50%) rotate(-14deg);filter:drop-shadow(0 30px 40px #000)}
.hero.has-img .hero-watch{display:none}
.hero>*:not(.hero-img):not(.hero-watch){position:relative;z-index:2}
h1,h2{font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1.02}
h1{font-size:clamp(2.4rem,9vw,5.5rem)}
.hero p{font-weight:500;letter-spacing:.06em;text-transform:uppercase;margin:10px 0 28px;font-size:.95rem}
.btn{display:block;text-align:center;padding:17px 28px;border:1px solid #fff;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.9rem;transition:.25s}
.btn:hover{background:#fff;color:#000}
.hero .btn{max-width:640px;width:100%}

/* sections */
section{padding:72px var(--pad)}
.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:32px;gap:16px}
h2{font-size:clamp(1.7rem,5vw,3rem)}
.head a{color:var(--mute);border-bottom:1px solid var(--mute);font-size:.9rem;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:22px}}
.card figure{background:var(--panel);aspect-ratio:4/5;display:grid;place-items:center;padding:14px;overflow:hidden;position:relative}
.card figure svg,.card figure img{width:78%;transition:transform .5s}
.card:hover figure svg,.card:hover figure img{transform:scale(1.06)}
.card .tag{position:absolute;top:10px;left:10px;font-size:.7rem;background:var(--gold);color:#000;padding:3px 8px;font-weight:700}
.card h3{font-size:1rem;font-weight:600;margin-top:12px}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.card .price{color:var(--mute);font-size:.95rem}
.add{border:1px solid var(--line);padding:6px 12px;font-size:.8rem;transition:.2s}
.add:hover,.add.done{background:var(--gold);border-color:var(--gold);color:#000}
.card p{color:var(--mute);font-size:.85rem;margin-top:6px}
.more{max-width:420px;margin:44px auto 0}

/* compare */
.cmp-sec{background:#fff;color:#000;text-align:center}
.cmp-sec h2{margin-bottom:6px}
.cmp-sec .sub{color:#555;margin-bottom:28px;font-size:.95rem}
.cmp{--p:50;position:relative;max-width:760px;margin:auto;aspect-ratio:1/1;background:#ececec;overflow:hidden;touch-action:pan-y}
.cmp .layer{position:absolute;inset:0;display:grid;place-items:center}
.cmp .layer svg{width:62%}
.cmp .top{clip-path:inset(0 calc(100% - var(--p)*1%) 0 0)}
.cmp .bar{position:absolute;top:0;bottom:0;left:calc(var(--p)*1%);width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08);pointer-events:none}
.cmp .knob{position:absolute;top:50%;left:calc(var(--p)*1%);width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#fff;border:2px solid #000;display:grid;place-items:center;pointer-events:none;font-size:1.1rem;letter-spacing:-.1em}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize}
.cmp:focus-within .knob{outline:2px solid var(--gold);outline-offset:3px}
.names{display:flex;justify-content:space-between;max-width:760px;margin:14px auto 0;font-weight:600;font-size:.95rem}

footer{border-top:1px solid var(--line);padding:48px var(--pad);display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;color:var(--mute);font-size:.85rem}
footer .logo{color:#fff}
.page-title{padding:56px var(--pad) 0}
.page-title p{color:var(--mute);margin-top:8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

[hidden]{display:none!important}
html{color-scheme:dark}
.hdr{padding-top:calc(20px + env(safe-area-inset-top,0px))}
/* Product detail overlay: responsive mobile-first */
.product-overlay{position:fixed;inset:0;z-index:55;background:#050505;overflow:auto;display:none}.product-overlay.open{display:block}.product-overlay .pback{padding:18px var(--pad);color:var(--mute);font-size:.85rem}.product-overlay .pgrid{display:grid;grid-template-columns:1fr;gap:24px;padding:0 var(--pad) 48px}.product-overlay .pgallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}.product-overlay .pgallery img{width:100%;aspect-ratio:4/5;object-fit:contain;background:#101010}.product-overlay .pgallery img:first-child{grid-column:1/-1}.product-overlay .pinfo h1{font-size:clamp(2rem,6vw,3.5rem);margin:8px 0}.product-overlay .pprice{font-size:1.1rem;color:#aaa;margin:12px 0 20px}.product-overlay .pdesc{color:#aaa;margin:18px 0}.product-overlay .pqty{display:flex;align-items:center;border:1px solid #333;width:max-content;margin:18px 0}.product-overlay .pqty button{width:42px;height:42px}.product-overlay .pqty span{min-width:30px;text-align:center}.product-overlay .pinfo .btn{width:100%;margin:8px 0}.product-overlay .pclose{float:right;font-size:1.8rem;padding:10px}.product-overlay .pinfo{padding-bottom:25px}@media(min-width:800px){.product-overlay .pgrid{grid-template-columns:1.1fr .9fr;gap:40px;max-width:1250px;margin:auto}.product-overlay .pgallery{grid-template-columns:1fr 1fr}.product-overlay .pgallery img:first-child{grid-column:auto}.product-overlay .pinfo{position:sticky;top:25px;height:max-content;padding-top:20px}}
</style></head>
<body>
<header class="hdr" id="top"></header>
<main id="home">
<section class="hero" style="--hero:url(images/hero.jpg)">
 <div class="hero-img"></div><div class="hero-watch"></div>
 <h1>New Collections</h1>
 <p>Make every second count.</p>
 <a class="btn" href="#collection">Shop now</a>
</section>
<section id="best">
 <div class="head"><h2>Best Sellers</h2><a href="#collection">View all</a></div>
 <div class="grid" data-grid="best"></div>
</section>
<section class="cmp-sec">
 <h2>Choose your colour</h2>
 <p class="sub">Same watch. Two looks. Slide to compare.</p>
 <div class="cmp">
  <div class="layer base"></div><div class="layer top"></div>
  <div class="bar"></div><div class="knob" aria-hidden="true">&lsaquo;&rsaquo;</div>
  <input type="range" min="0" max="100" value="50" aria-label="Compare Noir and Ivory editions">
 </div>
 <div class="names"><span>Noir</span><span>Ivory</span></div>
</section>
<section id="featured">
 <div class="head"><h2>The Collection</h2></div>
 <div class="grid" data-grid="collection"></div>
 <a class="btn more" href="#collection">View full collection</a>
</section>
</main>
<main id="colpage" hidden>
 <div class="page-title"><h2>The Collection</h2><p>8 watches. Every one made to last.</p></div>
 <section><div class="grid" data-grid="all"></div></section>
</main>
<footer id="foot"></footer>
<script>/* Edit products here. Add img:"images/name.jpg" to use a real photo instead of the drawing. */
const WATCHES=[
{id:1,name:"Noir Classic",price:2450,case:"#b9833f",dial:"#0b0b0b",strap:"#1b1b1b",best:1,desc:"Black dial, gold case, leather strap."},
{id:2,name:"Aurum Date",price:2850,case:"#c9a063",dial:"#15110b",strap:"#3a2616",best:1,desc:"Gold hands and a clean date window."},
{id:3,name:"Steel Chrono",price:3200,case:"#aeb4ba",dial:"#0f1317",strap:"#242424",mark:"#e8e8e8",best:1,desc:"Steel case with a sharp sport look."},
{id:4,name:"Midnight Slim",price:1950,case:"#2d2d2d",dial:"#050505",strap:"#111",mark:"#bdbdbd",best:1,desc:"All black. Slim and easy to wear daily."},
{id:5,name:"Olive Field",price:2150,case:"#8a7b52",dial:"#2c3322",strap:"#4a3b28",desc:"Soft green dial for everyday wear."},
{id:6,name:"Rose Dress",price:2700,case:"#c58b78",dial:"#ede4da",strap:"#2a1a14",mark:"#4a3128",desc:"Light dial with a rose gold case."},
{id:7,name:"Ivory Classic",price:2350,case:"#c9a063",dial:"#ebe3d0",strap:"#5a3d22",mark:"#2a2218",desc:"Warm ivory dial, simple and clean."},
{id:8,name:"Cobalt Diver",price:3400,case:"#9fa7ae",dial:"#10264a",strap:"#15171a",mark:"#f1f1f1",desc:"Deep blue dial, strong and bold."}
];

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const egp=n=>"EGP "+n.toLocaleString("en-US");

function watchSVG(c,label="Watch"){
 const mk=c.mark||c.case;
 const ticks=[...Array(12)].map((_,i)=>{const a=i*Math.PI/6,r=i%3?62:56;
  return `<line x1="${(100+Math.sin(a)*r).toFixed(1)}" y1="${(130-Math.cos(a)*r).toFixed(1)}" x2="${(100+Math.sin(a)*70).toFixed(1)}" y2="${(130-Math.cos(a)*70).toFixed(1)}" stroke="${mk}" stroke-width="${i%3?1.5:3.2}"/>`}).join("");
 return `<svg viewBox="0 0 200 260" role="img" aria-label="${label}"><rect x="72" y="0" width="56" height="92" rx="9" fill="${c.strap}"/><rect x="72" y="168" width="56" height="92" rx="9" fill="${c.strap}"/><rect x="178" y="123" width="9" height="14" rx="2" fill="${c.case}"/><circle cx="100" cy="130" r="82" fill="${c.case}"/><circle cx="100" cy="130" r="74" fill="${c.dial}"/><circle cx="100" cy="130" r="74" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="2"/>${ticks}<line x1="100" y1="130" x2="65" y2="110" stroke="${mk}" stroke-width="4" stroke-linecap="round"/><line x1="100" y1="130" x2="150" y2="101" stroke="${mk}" stroke-width="2.6" stroke-linecap="round"/><circle cx="100" cy="130" r="4.5" fill="${c.case}"/></svg>`}

/* bag */
const bag={get(){try{return +localStorage.getItem("lahza-bag")||0}catch(e){return 0}},
 add(){try{localStorage.setItem("lahza-bag",this.get()+1)}catch(e){}this.show()},
 show(){const b=$(".bag b");if(b)b.textContent=this.get()}};

/* header + footer */
const ico={menu:'<path d="M3 7h18M3 12h18M3 17h18" stroke-linecap="round"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5" stroke-linecap="round"/>',bag:'<path d="M5 8h14l-1 12H6L5 8zM9 8V6a3 3 0 016 0v2" stroke-linejoin="round"/>'};
function chrome(){
 const h=$("#top");
 h.innerHTML=`<div class="l"><button id="mb" aria-label="Open menu"><svg viewBox="0 0 24 24">${ico.menu}</svg></button><button aria-label="Search"><svg viewBox="0 0 24 24">${ico.search}</svg></button></div><a class="logo" href="#home">LAHZA</a><div class="r"><button class="bag" aria-label="Bag"><svg viewBox="0 0 24 24">${ico.bag}</svg><b>0</b></button></div>`;
 const m=document.createElement("nav");m.className="menu";m.setAttribute("aria-label","Menu");
 m.innerHTML=`<button aria-label="Close menu">&times;</button><a href="#home">Home</a><a href="#best">Best sellers</a><a href="#collection">Collection</a>`;
 document.body.append(m);
 $("#mb").onclick=()=>m.classList.add("open");
 $$("button,a",m).forEach(e=>e.onclick=()=>m.classList.remove("open"));
 const f=$("#foot");if(f)f.innerHTML=`<div><div class="logo">LAHZA</div><p>Make every second count.</p></div><p>&copy; 2026 LAHZA. All rights reserved.</p>`;
 bag.show();
}

/* product grids */
function card(w){
 const pic=w.img?`<img src="${w.img}" alt="${w.name}" loading="lazy">`:watchSVG(w,w.name);
 return `<article class="card"><figure>${w.best?'<span class="tag">Best seller</span>':''}${pic}</figure><h3>${w.name}</h3><p>${w.desc}</p><div class="row"><span class="price">${egp(w.price)}</span><button class="add" data-id="${w.id}">Add</button></div></article>`}
function grids(){
 const sets={best:WATCHES.filter(w=>w.best),collection:WATCHES.filter(w=>!w.best),all:WATCHES};
 $$("[data-grid]").forEach(g=>g.innerHTML=sets[g.dataset.grid].map(card).join(""));
 document.addEventListener("click",e=>{const b=e.target.closest(".add");if(!b)return;bag.add();b.textContent="Added";b.classList.add("done");setTimeout(()=>{b.textContent="Add";b.classList.remove("done")},1400)});
}

/* hero + compare */
function hero(){
 const h=$(".hero");if(!h)return;
 $(".hero-watch").innerHTML=watchSVG({case:"#b9833f",dial:"#0b0b0b",strap:"#1b1b1b"},"LAHZA gold watch");
 const i=new Image();i.onload=()=>h.classList.add("has-img");i.src="images/hero.jpg";
}
function compare(){
 const c=$(".cmp");if(!c)return;
 const A={case:"#c9a063",dial:"#0b0b0b",strap:"#1b1b1b"},B={case:"#c9a063",dial:"#ebe3d0",strap:"#5a3d22",mark:"#2a2218"};
 $(".top",c).innerHTML=watchSVG(A,"Noir edition");$(".base",c).innerHTML=watchSVG(B,"Ivory edition");
 $("input",c).oninput=e=>c.style.setProperty("--p",e.target.value);
}
function route(){const h=location.hash.slice(1),col=h==="collection";
 $("#home").hidden=col;$("#colpage").hidden=!col;$("#top").classList.toggle("solid",col);window.scrollTo(0,0);
 if(!col&&h&&h!=="home"){const t=document.getElementById(h);if(t)t.scrollIntoView()}}
chrome();grids();hero();compare();addEventListener("hashchange",route);route();

// Product page enhancement: cards open a dedicated, responsive details view.
(()=>{
 const photosById={1:["https://files.easy-orders.net/1778692656611627178.webp","https://files.easy-orders.net/1778692656594511153.webp"],2:["https://files.easy-orders.net/1778691758307075952.webp","https://files.easy-orders.net/1778691758175438381.webp"],3:["https://i.pinimg.com/1200x/26/db/f5/26dbf51d6827b642145ad21ab8117b23.jpg"],4:["https://i.pinimg.com/1200x/29/36/f6/2936f6abe36ae4a73924b7daaae28fab.jpg"],5:["https://i.pinimg.com/736x/5f/d7/bd/5fd7bdf8ae4104e4c2c382b28acfe62f.jpg"],6:["https://i.pinimg.com/1200x/05/87/1b/05871b8c133b9060f95cdd9c06094d1c.jpg"],7:["https://i.pinimg.com/736x/1c/fc/af/1cfcaf8b2453eeffb52492ca0246d09a.jpg"],8:["https://i.pinimg.com/736x/46/1d/fb/461dfb71ed8f2d894fb9b9f589822f24.jpg"]};
 const overlay=document.createElement("main");overlay.className="product-overlay";overlay.id="productOverlay";document.body.appendChild(overlay);
 const findWatch=name=>WATCHES.find(w=>w.name===name);
 function showProduct(w){if(!w)return;const pics=photosById[w.id]||[];const gallery=pics.map(url=>'<img src="'+url+'" alt="'+w.name+'" loading="lazy">').join("");overlay.innerHTML='<button class="pclose" aria-label="Close details">×</button><a href="#collection" class="pback">← Back to watches</a><div class="pgrid"><div class="pgallery">'+gallery+'</div><div class="pinfo"><small>LAHZA / WATCHES</small><h1>'+w.name+'</h1><div class="pprice">EGP '+w.price.toLocaleString("en-US")+'</div><p class="pdesc">'+w.desc+'</p><p class="pdesc">Designed for everyday wear with a refined finish and comfortable fit.</p><div class="pqty"><button id="pqminus">−</button><span id="pqty">1</span><button id="pqplus">+</button></div><button class="btn" id="padd">Add to bag</button><button class="btn" id="pbuynow">Buy now</button></div></div>';
 let qty=1;overlay.classList.add("open");document.body.style.overflow="hidden";overlay.scrollTop=0;overlay.querySelector(".pclose").onclick=close;overlay.querySelector(".pback").onclick=close;
 overlay.querySelector("#pqminus").onclick=()=>{qty=Math.max(1,qty-1);overlay.querySelector("#pqty").textContent=qty};overlay.querySelector("#pqplus").onclick=()=>{overlay.querySelector("#pqty").textContent=++qty};
 overlay.querySelector("#padd").onclick=()=>{for(let i=0;i<qty;i++)bag.add();close();};overlay.querySelector("#pbuynow").onclick=()=>{for(let i=0;i<qty;i++)bag.add();close();document.querySelector(".bag")?.click()};
 }
 function close(){overlay.classList.remove("open");document.body.style.overflow="";overlay.innerHTML=""}
 document.addEventListener("click",e=>{if(overlay.classList.contains("open"))return;const card=e.target.closest(".card");if(!card||e.target.closest(".add"))return;const name=card.querySelector("h3")?.textContent?.trim();if(name){e.preventDefault();e.stopImmediatePropagation();showProduct(findWatch(name))}},true);
 document.addEventListener("keydown",e=>{if(e.key==="Escape"&&overlay.classList.contains("open"))close()});
})();
</script>
</body></html>
